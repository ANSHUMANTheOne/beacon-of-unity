
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoltWay | EYSC</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 95% 5%, #e1f3e5, transparent 38%),
    radial-gradient(circle at 5% 95%, #fff0ed, transparent 35%),
    #f8faf8;
  color: #17291e;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 35px 20px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.voltorb {
  width: 30px;
  height: 30px;
  border: 2px solid #222;
  border-radius: 50%;
  background: linear-gradient(
    to bottom,
    #ed514a 0%,
    #ed514a 47%,
    #222 47%,
    #222 54%,
    white 54%
  );
  position: relative;
}

.voltorb::after {
  content: "";
  position: absolute;
  width: 8px;
  height: 8px;
  background: white;
  border: 2px solid #222;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: -1px;
}

h1 span {
  color: #248553;
}

.eysc {
  background: #eaf6ed;
  color: #248553;
  border: 1px solid #d5e9d9;
  padding: 8px 14px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: bold;
}

.video-card {
  background: white;
  padding: 12px;
  border: 1px solid #e0e9e2;
  border-radius: 20px;
  box-shadow: 0 18px 45px rgba(0,0,0,0.07);
}

video {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #111;
  border-radius: 12px;
}

.actions {
  display: flex;
  justify-content: flex-end;
  padding: 15px 4px 4px;
}

.download {
  display: inline-block;
  padding: 13px 20px;
  background: #248553;
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}

.download:hover {
  background: #17653c;
}

.fallback {
  display: none;
  margin-top: 12px;
  padding: 15px;
  border-radius: 10px;
  background: #fff4e8;
  color: #65452c;
  text-align: center;
  font-size: 14px;
}

.fallback a {
  color: #17653c;
  font-weight: bold;
}

@media (max-width: 600px) {
  .container {
    padding: 20px 12px;
  }

  h1 {
    font-size: 26px;
  }

  .video-card {
    padding: 7px;
  }

  .download {
    width: 100%;
    text-align: center;
  }
}
</style>
</head>

<body>

<main class="container">

  <header>
    <div class="brand">
      <div class="voltorb"></div>
      <h1>Volt<span>Way</span></h1>
    </div>
    <div class="eysc">EYSC</div>
  </header>

  <section class="video-card">

    <video
      id="voltwayVideo"
      controls
      playsinline
      preload="metadata"
    ></video>

    <div id="fallback" class="fallback">
      The video could not load here.
      <a id="openVideo" href="#" target="_blank" rel="noopener">
        Open video directly
      </a>
    </div>

    <div class="actions">
      <a
        id="downloadBtn"
        class="download"
        href="#"
        download="VoltWay_EYSC_Video.mp4"
      >
        ↓ Download Video
      </a>
    </div>

  </section>

</main>

<script>
const video = document.getElementById("voltwayVideo");
const fallback = document.getElementById("fallback");
const downloadBtn = document.getElementById("downloadBtn");
const openVideo = document.getElementById("openVideo");

const videoSources = [
  new URL("voltwayvideo.mp4", document.baseURI).href,
  "https://anshumantheone.github.io/beacon-of-unity/voltwayvideo.mp4",
  "https://raw.githubusercontent.com/ANSHUMANTheOne/beacon-of-unity/main/voltwayvideo.mp4"
];

let currentSource = 0;
let loadTimer;

function loadVideo(index) {
  clearTimeout(loadTimer);

  if (index >= videoSources.length) {
    fallback.style.display = "block";
    return;
  }

  currentSource = index;

  const url = videoSources[index];

  video.src = url;
  video.load();

  downloadBtn.href = url;
  openVideo.href = url;

  loadTimer = setTimeout(() => {
    if (video.readyState < 1) {
      loadVideo(currentSource + 1);
    }
  }, 12000);
}

video.addEventListener("loadedmetadata", () => {
  clearTimeout(loadTimer);
  fallback.style.display = "none";
});

video.addEventListener("error", () => {
  clearTimeout(loadTimer);
  loadVideo(currentSource + 1);
});

loadVideo(0);
</script>

</body>
</html>
