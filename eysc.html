
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoltWay | EYSC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7faf7;
      color: #1c3024;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 34px;
      margin: 0;
      letter-spacing: -1px;
    }

    h1 span {
      color: #248553;
    }

    .eysc {
      background: #e7f3e9;
      color: #248553;
      padding: 9px 15px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: bold;
    }

    .video-card {
      background: white;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #e1e9e2;
      box-shadow: 0 15px 40px rgba(0,0,0,0.06);
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #101510;
      border-radius: 12px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      padding: 16px 5px 5px;
    }

    .download {
      display: inline-block;
      background: #248553;
      color: white;
      padding: 13px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .download:hover {
      background: #17653c;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 27px;
      }

      .container {
        padding: 22px 12px;
      }

      .video-card {
        padding: 7px;
      }

      .actions {
        padding: 12px 2px 3px;
      }

      .download {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <h1>Volt<span>Way</span></h1>
      <div class="eysc">EYSC</div>
    </header>

    <section class="video-card">

      <video controls playsinline preload="metadata">
        <source
          src="https://anshumantheone.github.io/beacon-of-unity/voltwayvideo.mp4"
          type="video/mp4"
        >
        Your browser does not support HTML5 video.
      </video>

      <div class="actions">
        <a
          class="download"
          href="https://anshumantheone.github.io/beacon-of-unity/voltwayvideo.mp4"
          download="VoltWay_EYSC_Video.mp4"
        >
          ↓ Download Video
        </a>
      </div>

    </section>

  </main>

</body>
</html>
