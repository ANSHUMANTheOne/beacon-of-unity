name: Social checks
on:
  pull_request:
    paths: ['social/**', '.github/workflows/social-ci.yml']
  push:
    paths: ['social/**', '.github/workflows/social-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: social/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
