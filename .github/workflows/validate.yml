name: Validate compatibility artifact
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python scripts/test-publisher.py
      - run: node scripts/cloudflare-build.mjs
      - name: Confirm an unchanged artifact can be reused safely
        run: node scripts/cloudflare-build.mjs
      - run: python scripts/validate.py
      - run: node scripts/test-worker.mjs
      - run: node scripts/test-cozystudio.mjs
      - run: python scripts/check-inline-syntax.py
      - name: Validate Wrangler configuration without uploading or deploying
        run: npx --yes wrangler@4.157.0 deploy --dry-run --outdir .verification/wrangler-dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-public-tree
          path: dist/
          include-hidden-files: true
          retention-days: 14
